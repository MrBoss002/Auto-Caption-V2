name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: test-token
      MONGODB_URI: mongodb://localhost:27017
      TELEGRAM_WEBHOOK_SECRET: test-webhook-secret
      BOT_SETUP_SECRET: test-setup-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck code
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build
